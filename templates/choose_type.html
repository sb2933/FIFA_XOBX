<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Tournament Type</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Choose Tournament Type</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <button type="submit" name="tournament_type" value="knockout" class="btn">
                    Knockout Tournament
                </button>

                <button type="submit" name="tournament_type" value="league" class="btn">
                    League Tournament
                </button>
            </form>
        </div>
    </div>

</body>
</html>
