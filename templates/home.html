<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA Tournament Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>FIFA Tournament Manager</h1>
            <p>Create your profile, log in, and manage FIFA tournaments easily.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <div class="button-group">
                <a href="{{ url_for('signup') }}" class="btn">Sign Up</a>
                <a href="{{ url_for('login') }}" class="btn">Log In</a>
            </div>

            <p><a href="{{ url_for('forgot_password') }}" class="link">Forgot Password?</a></p>
        </div>
    </div>
</body>
</html>
