<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Welcome Back</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="message {{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="text" name="username" placeholder="Username or Player ID">
                <input type="password" name="password" placeholder="Password">
                <button type="submit" class="btn">Log In</button>
            </form>

            <p><a href="{{ url_for('forgot_password') }}" class="link">Forgot Password?</a></p>
            <p>Don’t have an account? <a href="{{ url_for('signup') }}" class="link">Sign Up</a></p>
            <p><a href="{{ url_for('home') }}" class="link">Back to Home</a></p>
        </div>
    </div>
</body>
</html>
